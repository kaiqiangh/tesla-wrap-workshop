<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%229%22 fill=%22%238cf7d5%22/><path d=%22M8 9h16l-3 14H11z%22 fill=%22%23080b10%22/></svg>" />
  <title>WrapForge — Creator upload prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b10;
      --surface: #10151d;
      --surface-2: #151c25;
      --surface-3: #1b2430;
      --line: rgba(255,255,255,.12);
      --line-strong: rgba(255,255,255,.22);
      --text: #f4f7f9;
      --muted: #96a2b2;
      --accent: #8cf7d5;
      --accent-ink: #06251c;
      --warn: #ffca72;
      --danger: #ff7b88;
      --good: #78e8b8;
      --radius: 18px;
      --shadow: 0 28px 90px rgba(0,0,0,.42);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; min-width: 320px; color: var(--text); background: var(--bg); }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(34px, 5vw, 64px); line-height: .98; letter-spacing: -.055em; }
    h2 { font-size: clamp(25px, 3vw, 38px); line-height: 1.05; letter-spacing: -.035em; }
    h3 { letter-spacing: -.02em; }
    .muted { color: var(--muted); }
    .eyebrow { margin-bottom: 11px; color: var(--accent); font-size: 11px; font-weight: 850; letter-spacing: .16em; text-transform: uppercase; }
    .topbar { min-height: 68px; padding: 0 4vw; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); background: rgba(8,11,16,.88); backdrop-filter: blur(18px); position: sticky; top: 0; z-index: 40; }
    .brand { display: inline-flex; align-items: center; gap: 10px; border: 0; background: none; color: var(--text); font-weight: 900; letter-spacing: -.03em; }
    .brand-mark { width: 27px; height: 27px; border: 2px solid var(--accent); border-radius: 9px 4px 9px 4px; transform: rotate(-8deg); box-shadow: inset 0 0 0 4px rgba(140,247,213,.08); }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .save-state { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
    .save-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 4px rgba(120,232,184,.10); }
    .avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: #0d1820; background: linear-gradient(135deg,var(--accent),#82a7ff); font-size: 11px; font-weight: 900; }
    .primary, .secondary, .ghost, .danger-btn { min-height: 43px; padding: 0 17px; border-radius: 999px; cursor: pointer; font-weight: 800; }
    .primary { color: var(--accent-ink); background: var(--accent); border: 1px solid var(--accent); }
    .secondary { color: var(--text); background: rgba(255,255,255,.07); border: 1px solid var(--line-strong); }
    .ghost { color: var(--muted); background: transparent; border: 1px solid transparent; }
    .danger-btn { color: #ffe9ec; background: rgba(255,123,136,.10); border: 1px solid rgba(255,123,136,.35); }
    button:disabled { cursor: not-allowed; opacity: .42; }
    .icon-btn { width: 40px; min-height: 40px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.04); cursor: pointer; }
    .field { display: grid; gap: 8px; }
    .field label, .field-label { font-size: 12px; color: #c5ced9; font-weight: 750; }
    input, textarea, select { width: 100%; color: var(--text); background: #0c1118; border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; }
    textarea { min-height: 112px; resize: vertical; }
    option { background: #0c1118; }
    .hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .counter { float: right; color: var(--muted); font-weight: 500; }
    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: rgba(16,21,29,.88); box-shadow: var(--shadow); }
    .notice { padding: 14px 15px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.035); font-size: 13px; line-height: 1.5; }
    .notice.good { border-color: rgba(120,232,184,.30); background: rgba(120,232,184,.07); }
    .notice.warn { border-color: rgba(255,202,114,.32); background: rgba(255,202,114,.08); }
    .notice.error { border-color: rgba(255,123,136,.36); background: rgba(255,123,136,.08); }
    .status-code { display: inline-block; margin-top: 7px; color: var(--danger); font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .tag { display: inline-flex; align-items: center; gap: 6px; min-height: 27px; padding: 0 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 11px; }
    .tag.active { border-color: rgba(140,247,213,.34); color: #d8fff3; background: rgba(140,247,213,.08); }
    .checkbox { display: grid; grid-template-columns: 20px 1fr; align-items: start; gap: 10px; color: #d6dde5; font-size: 13px; line-height: 1.5; cursor: pointer; }
    .checkbox input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 24px; }
    .actions-end { display: flex; gap: 10px; margin-left: auto; }
    .step-number { width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-strong); color: var(--muted); font-size: 12px; font-weight: 900; flex: 0 0 auto; }
    .step-number.current { color: var(--accent-ink); border-color: var(--accent); background: var(--accent); }
    .step-number.complete { color: var(--good); border-color: rgba(120,232,184,.35); background: rgba(120,232,184,.08); }
    .variant-card-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .variant-card { min-height: 112px; padding: 15px; text-align: left; border: 1px solid var(--line); border-radius: 14px; background: #0c1118; cursor: pointer; }
    .variant-card.selected { border-color: var(--accent); background: rgba(140,247,213,.07); box-shadow: inset 0 0 0 1px rgba(140,247,213,.15); }
    .variant-card strong { display: block; margin: 8px 0 5px; font-size: 14px; }
    .variant-card small { display: block; color: var(--muted); line-height: 1.35; }
    .file-zone { min-height: 210px; padding: 26px; display: grid; place-items: center; text-align: center; border: 1px dashed var(--line-strong); border-radius: 17px; background: radial-gradient(circle at 50% 0,rgba(140,247,213,.08),transparent 55%),#0c1118; }
    .file-icon { width: 54px; height: 66px; margin: 0 auto 15px; border: 2px solid var(--accent); border-radius: 7px 15px 7px 7px; position: relative; opacity: .9; }
    .file-icon::after { content: "PNG"; position: absolute; left: 7px; bottom: 9px; font-size: 10px; font-weight: 900; color: var(--accent); }
    .scenario-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; margin-top: 13px; }
    .validation-list { display: grid; gap: 9px; margin-top: 16px; }
    .validation-row { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 9px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.025); font-size: 12px; }
    .validation-row .mark { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.06); color: var(--muted); font-size: 10px; }
    .validation-row.pass .mark { color: #072419; background: var(--good); }
    .validation-row.fail .mark { color: #2d060b; background: var(--danger); }
    .validation-row.pending .mark { color: #312004; background: var(--warn); }
    .validation-row span:last-child { color: var(--muted); text-align: right; }
    .art-preview { min-height: 300px; border-radius: 15px; overflow: hidden; position: relative; background: linear-gradient(135deg,#ff4f78 0 18%,#782de2 18% 40%,#10182f 40% 66%,#0ad6a3 66%); isolation: isolate; }
    .art-preview::before { content: ""; position: absolute; inset: -10%; background: repeating-linear-gradient(112deg,transparent 0 11%,rgba(255,255,255,.16) 11% 11.8%,transparent 11.8% 22%); transform: rotate(-5deg); mix-blend-mode: overlay; }
    .art-preview::after { content: "PREVIEW ONLY"; position: absolute; right: 12px; bottom: 12px; padding: 6px 9px; border-radius: 999px; background: rgba(5,8,13,.72); border: 1px solid rgba(255,255,255,.14); color: rgba(255,255,255,.72); font-size: 10px; letter-spacing: .12em; }
    .compat { padding: 15px; border: 1px solid rgba(140,247,213,.28); border-radius: 13px; background: rgba(140,247,213,.07); line-height: 1.45; }
    .compat strong { display: block; margin-bottom: 5px; }
    .publish-result { margin-top: 18px; padding: 17px; border: 1px solid rgba(120,232,184,.33); border-radius: 14px; background: rgba(120,232,184,.08); }
    .publish-result strong { color: var(--good); }
    .gate-list { display: grid; gap: 8px; margin: 16px 0; }
    .gate { display: grid; grid-template-columns: 20px 1fr; gap: 9px; font-size: 12px; color: var(--muted); }
    .gate.ok { color: #d8fbed; }
    .gate::before { content: "○"; color: var(--muted); }
    .gate.ok::before { content: "✓"; color: var(--good); }
    .prototype-bar { position: fixed; z-index: 100; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 7px; max-width: calc(100vw - 20px); padding: 7px; border-radius: 999px; color: #080b10; background: #f7f9fb; box-shadow: 0 14px 55px rgba(0,0,0,.62); white-space: nowrap; }
    .prototype-bar button { width: 38px; height: 38px; border: 0; border-radius: 50%; color: #080b10; background: #e3e8ee; cursor: pointer; font-weight: 900; }
    .prototype-label { min-width: 220px; text-align: center; font-size: 12px; font-weight: 850; }
    .prototype-bar .state-toggle { width: auto; padding: 0 12px; border-radius: 999px; }
    .state-panel { position: fixed; z-index: 90; right: 17px; bottom: 76px; width: min(430px,calc(100vw - 34px)); max-height: 58vh; overflow: auto; display: none; padding: 16px; border: 1px solid var(--line); border-radius: 15px; color: #c8ffe9; background: rgba(7,10,15,.97); box-shadow: 0 20px 70px #000; white-space: pre-wrap; font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .state-panel.open { display: block; }

    /* A — guided studio */
    .variant-a { min-height: 100vh; background: radial-gradient(circle at 75% 18%,rgba(80,103,255,.09),transparent 30%),var(--bg); }
    .studio-shell { width: min(1480px,100%); margin: 0 auto; padding: 34px 4vw 110px; display: grid; grid-template-columns: 230px minmax(0,1fr) 310px; gap: 22px; align-items: start; }
    .studio-rail { padding: 20px; position: sticky; top: 92px; }
    .studio-rail h2 { font-size: 25px; }
    .rail-step { width: 100%; padding: 12px 0; display: flex; align-items: center; gap: 11px; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer; }
    .rail-step:last-child { border-bottom: 0; }
    .rail-step span:last-child { display: grid; gap: 3px; }
    .rail-step small { color: var(--muted); }
    .studio-work { padding: clamp(22px,4vw,42px); min-height: 650px; }
    .studio-work > .eyebrow { margin-top: 3px; }
    .studio-summary { padding: 19px; position: sticky; top: 92px; }
    .summary-art { min-height: 160px; margin-bottom: 15px; }
    .summary-list { display: grid; gap: 11px; margin: 17px 0; }
    .summary-row { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 12px; }
    .summary-row span:first-child { color: var(--muted); }
    .summary-row strong { max-width: 58%; text-align: right; }

    /* B — validation pipeline */
    .variant-b { --accent: #baff4f; --accent-ink: #132200; min-height: 100vh; background: linear-gradient(90deg,rgba(186,255,79,.035) 1px,transparent 1px),linear-gradient(rgba(186,255,79,.035) 1px,transparent 1px),#090c08; background-size: 42px 42px; }
    .pipeline-shell { width: min(1480px,100%); margin: 0 auto; padding: 30px 4vw 110px; }
    .pipeline-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .pipeline-head h1 { max-width: 770px; margin-bottom: 6px; }
    .pipeline-stages { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); border: 1px solid var(--line); border-radius: 15px; overflow: hidden; background: rgba(8,12,7,.86); }
    .pipeline-stage { min-height: 88px; padding: 14px; display: flex; align-items: center; gap: 10px; text-align: left; border: 0; border-right: 1px solid var(--line); background: transparent; cursor: pointer; }
    .pipeline-stage:last-child { border-right: 0; }
    .pipeline-stage.active { background: rgba(186,255,79,.08); }
    .pipeline-body { margin-top: 18px; display: grid; grid-template-columns: minmax(0,1.15fr) minmax(330px,.55fr); gap: 18px; }
    .pipeline-command { padding: clamp(22px,4vw,40px); min-height: 590px; }
    .pipeline-inspector { padding: 20px; }
    .trust-boundary { margin: 18px 0; padding: 15px; border: 1px solid rgba(186,255,79,.28); border-radius: 13px; background: rgba(186,255,79,.06); }
    .trust-boundary strong { display: block; margin-bottom: 6px; }
    .pipeline-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }

    /* C — publish checklist */
    .variant-c { --accent: #ffcf70; --accent-ink: #2b1900; min-height: 100vh; background: #0d0b09; }
    .checklist-head { padding: 48px 5vw 30px; border-bottom: 1px solid var(--line); }
    .checklist-head > div { width: min(1240px,100%); margin: 0 auto; }
    .checklist-head h1 { max-width: 880px; }
    .checklist-shell { width: min(1240px,100%); margin: 0 auto; padding: 26px 5vw 120px; display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 22px; align-items: start; }
    .check-stack { display: grid; gap: 13px; }
    .check-section { border: 1px solid var(--line); border-radius: 15px; background: #14110e; overflow: hidden; }
    .check-head { width: 100%; min-height: 74px; padding: 15px 18px; display: flex; align-items: center; gap: 12px; text-align: left; border: 0; background: transparent; cursor: pointer; }
    .check-head-copy { display: grid; gap: 3px; }
    .check-head-copy small { color: var(--muted); }
    .check-content { padding: 0 18px 20px 62px; }
    .readiness { padding: 20px; position: sticky; top: 92px; }
    .readiness-score { width: 92px; height: 92px; margin: 12px 0 18px; display: grid; place-items: center; border-radius: 50%; border: 8px solid rgba(255,207,112,.16); color: var(--accent); font-size: 24px; font-weight: 900; }

    @media (max-width: 1050px) {
      .studio-shell { grid-template-columns: 190px minmax(0,1fr); }
      .studio-summary { display: none; }
      .pipeline-body { grid-template-columns: 1fr; }
      .pipeline-inspector { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; }
      .checklist-shell { grid-template-columns: 1fr; }
      .readiness { position: static; }
    }
    @media (max-width: 720px) {
      .topbar { min-height: 61px; padding: 0 17px; }
      .save-state { display: none; }
      .studio-shell { padding: 16px 16px 108px; grid-template-columns: 1fr; }
      .studio-rail { position: static; display: grid; grid-template-columns: repeat(4,1fr); padding: 7px; }
      .studio-rail h2, .studio-rail > .muted { display: none; }
      .rail-step { justify-content: center; padding: 8px 3px; border-bottom: 0; }
      .rail-step span:last-child { display: none; }
      .studio-work { min-height: auto; padding: 22px 18px; }
      .pipeline-shell { padding: 24px 16px 108px; }
      .pipeline-head { align-items: start; flex-direction: column; }
      .pipeline-head h1 { font-size: 40px; }
      .pipeline-stages { overflow-x: auto; grid-template-columns: repeat(4,minmax(150px,1fr)); }
      .pipeline-body { min-width: 0; }
      .pipeline-command { min-height: auto; padding: 22px 18px; }
      .pipeline-inspector { display: block; }
      .pipeline-grid, .variant-card-grid { grid-template-columns: 1fr; }
      .checklist-head { padding: 35px 17px 22px; }
      .checklist-head h1 { font-size: 39px; }
      .checklist-shell { padding: 16px 16px 108px; }
      .check-content { padding-left: 18px; }
      .scenario-row { grid-template-columns: 1fr; }
      .actions { align-items: stretch; flex-direction: column-reverse; }
      .actions-end { width: 100%; }
      .actions-end button { flex: 1; }
      .prototype-label { min-width: 132px; }
      .prototype-bar { bottom: 8px; }
      .prototype-bar .state-toggle { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // PROTOTYPE: Three creator upload UI variants, switchable with ?variant=, on a standalone throwaway page.
    const variants = { A: 'Guided studio', B: 'Validation pipeline', C: 'Publish checklist' };
    const steps = [
      { id: 1, title: 'Select Vehicle', short: 'Vehicle' },
      { id: 2, title: 'Upload File', short: 'File' },
      { id: 3, title: 'Add Details', short: 'Details' },
      { id: 4, title: 'Preview & Publish', short: 'Publish' }
    ];
    const templates = [
      { id: 'modely-2025-premium', model: 'Model Y', name: 'Model Y (2025+) Premium', dims: '1024 × 1024', verified: '9 Aug 2026' },
      { id: 'modely-2025-performance', model: 'Model Y', name: 'Model Y (2025+) Performance', dims: '1024 × 1024', verified: '9 Aug 2026' },
      { id: 'modely-generic', model: 'Model Y', name: 'Model Y', dims: '1024 × 1024', verified: '9 Aug 2026', note: 'Tesla does not publish a complete year or trim boundary.' },
      { id: 'cybertruck', model: 'Cybertruck', name: 'Cybertruck', dims: '1024 × 768', verified: '9 Aug 2026', note: 'Non-square official template.' }
    ];
    const scenarios = {
      valid: { label: 'Valid 824 KB · 1024 × 1024 PNG', file: 'oni-after-midnight.png', size: '824 KB', dims: '1024 × 1024' },
      validCybertruck: { label: 'Valid Cybertruck · 1024 × 768 PNG', file: 'angular-dust.png', size: '892 KB', dims: '1024 × 768' },
      tooLarge: { label: 'Too large · 1.7 MB PNG', file: 'large-wrap.png', size: '1.7 MB', dims: '1024 × 1024' },
      wrongFormat: { label: 'Wrong format · JPEG renamed PNG', file: 'renamed-image.png', size: '640 KB', dims: '1024 × 1024' },
      wrongDimensions: { label: 'Wrong dimensions · 512 × 512 PNG', file: 'small-wrap.png', size: '390 KB', dims: '512 × 512' },
      serverFailure: { label: 'Server decode failure after upload', file: 'corrupt-wrap.png', size: '711 KB', dims: '1024 × 1024' },
      expired: { label: 'Pending Upload expired before completion', file: 'abandoned-wrap.png', size: '801 KB', dims: '1024 × 1024' }
    };
    const params = () => new URLSearchParams(location.search);
    function current() {
      const p = params();
      return {
        variant: variants[p.get('variant')] ? p.get('variant') : 'A',
        step: Math.min(4, Math.max(1, Number(p.get('step') || 1))),
        template: templates.some(t => t.id === p.get('template')) ? p.get('template') : 'modely-2025-premium',
        scenario: scenarios[p.get('scenario')] ? p.get('scenario') : 'valid',
        phase: ['idle','ready','preflight-failed','validation-failed','expired','published','unpublished'].includes(p.get('phase')) ? p.get('phase') : 'idle',
        title: p.get('title') ?? 'Oni After Midnight',
        description: p.get('description') ?? 'A neon mask composition with deep indigo panels and sharp mint accents.',
        license: p.get('license') ?? 'Personal Use Allowed',
        rights: p.get('rights') === '1',
        templateConfirm: p.get('templateConfirm') === '1',
        stateOpen: p.get('state') === 'open',
        uploadId: p.get('uploadId') || 'up_7K4M2Q'
      };
    }
    function patch(next, replace = false) {
      const url = new URL(location.href);
      Object.entries(next).forEach(([key,value]) => value === null ? url.searchParams.delete(key) : url.searchParams.set(key,String(value)));
      history[replace ? 'replaceState' : 'pushState']({},'',url);
      render();
    }
    const chosenTemplate = () => templates.find(t => t.id === current().template) || templates[0];
    const scenario = () => scenarios[current().scenario];
    function safe(value) { return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'); }
    function stepState(id) {
      const s = current();
      if (id === 1) return 'complete';
      if (id === 2) return ['ready','published','unpublished'].includes(s.phase) ? 'complete' : (s.step === 2 ? 'current' : '');
      if (id === 3) return s.rights && s.templateConfirm && s.title.trim() ? 'complete' : (s.step === 3 ? 'current' : '');
      if (id === 4) return s.phase === 'published' ? 'complete' : (s.step === 4 ? 'current' : '');
      return '';
    }
    function readiness() {
      const s = current();
      const gates = [true, ['ready','published','unpublished'].includes(s.phase), !!s.title.trim(), s.rights, s.templateConfirm];
      return { gates, score: Math.round(gates.filter(Boolean).length / gates.length * 100), ready: gates.every(Boolean) };
    }
    function header() {
      return `<header class="topbar"><div class="brand"><span class="brand-mark"></span>WrapForge</div><div class="top-actions"><span class="save-state">Prototype state in URL</span><span class="avatar">KW</span></div></header>`;
    }
    function stepDot(step, extra = '') { return `<span class="step-number ${stepState(step.id)} ${extra}">${stepState(step.id)==='complete'?'✓':step.id}</span>`; }
    function templateCards() {
      return `<div class="variant-card-grid">${templates.map(t => `<button class="variant-card ${current().template===t.id?'selected':''}" data-template="${t.id}"><span class="tag ${current().template===t.id?'active':''}">${t.model}</span><strong>${t.name}</strong><small>${t.dims} · Active · verified ${t.verified}</small></button>`).join('')}</div>
      <p class="hint" style="margin-top:12px">Exact Active Template Variants come from the catalog. A Vehicle Model is only a browse grouping; free-text compatibility is unavailable.</p>`;
    }
    function validationRows() {
      const s=current(); const sc=scenario(); const t=chosenTemplate();
      const untouched=s.phase==='idle'; const preflightFail=s.phase==='preflight-failed'; const authorityFail=['validation-failed','expired'].includes(s.phase);
      const valid=['ready','published','unpublished'].includes(s.phase);
      const formatPass=!['wrongFormat'].includes(s.scenario);
      const sizePass=!['tooLarge'].includes(s.scenario);
      const dimPass=sc.dims===t.dims;
      const row=(label,status,value)=>`<div class="validation-row ${status}"><span class="mark">${status==='pass'?'✓':status==='fail'?'!':'·'}</span><strong>${label}</strong><span>${value}</span></div>`;
      return `<div class="validation-list">
        ${row('Client preflight', untouched?'':preflightFail?'fail':'pass', untouched?'Not run':preflightFail?'Stopped locally':'Fast feedback only')}
        ${row('PNG signature + decode', untouched?'':(!formatPass||s.scenario==='serverFailure')?'fail':'pass', formatPass?sc.file:'Signature mismatch')}
        ${row('Input size ≤ 1,000,000 bytes', untouched?'':sizePass?'pass':'fail', sc.size)}
        ${row(`Exact ${t.name} dimensions`, untouched?'':dimPass?'pass':'fail', `${sc.dims} required ${t.dims}`)}
        ${row('Authoritative server validation', untouched?'':authorityFail?'fail':preflightFail?'':'pass', untouched?'Not run':preflightFail?'Not reached':authorityFail?'Rejected':'Template-verified')}
        ${row('Original + preview + thumbnail', untouched||preflightFail?'':authorityFail?'fail':'pass', valid?'Immutable revision ready':authorityFail?'Not finalized':'Waiting')}
      </div>`;
    }
    function errorNotice() {
      const s=current();
      if (s.phase==='preflight-failed' && s.scenario==='tooLarge') return `<div class="notice error"><strong>Your file is 1.7 MB.</strong><br>The current maximum supported size is 1 MB. Choose a smaller PNG; no bytes were uploaded.<span class="status-code">WF-UPLOAD-SIZE</span></div>`;
      if (s.phase==='preflight-failed' && s.scenario==='wrongFormat') return `<div class="notice error"><strong>This file is not a readable PNG.</strong><br>Renaming a JPEG does not change its format. Export a PNG and try again.<span class="status-code">WF-UPLOAD-FORMAT</span></div>`;
      if (s.phase==='preflight-failed' && scenario().dims!==chosenTemplate().dims) return `<div class="notice error"><strong>This PNG is ${scenario().dims}.</strong><br>${chosenTemplate().name} requires exactly ${chosenTemplate().dims}. Return to your matching Tesla template and export again.<span class="status-code">WF-UPLOAD-DIMENSIONS</span></div>`;
      if (s.phase==='validation-failed') return `<div class="notice error"><strong>We could not safely read the uploaded PNG.</strong><br>The staged upload was not published. Start a fresh upload; the failed bytes will be cleaned up automatically.<span class="status-code">WF-UPLOAD-DECODE</span></div>`;
      if (s.phase==='expired') return `<div class="notice warn"><strong>This Pending Upload expired.</strong><br>For your security, unfinished uploads expire after 24 hours. Start a fresh upload to continue.<span class="status-code">WF-UPLOAD-EXPIRED</span></div>`;
      if (['ready','published','unpublished'].includes(s.phase)) return `<div class="notice good"><strong>Authoritative validation passed.</strong><br>The normalized Original Wrap Asset and both Derived Wrap Assets are complete in immutable revision rev_01.</div>`;
      return `<div class="notice"><strong>No file has been sent.</strong><br>Client preflight is only fast feedback. The server makes the publication decision after private direct upload.</div>`;
    }
    function vehicleStep() {
      const t=chosenTemplate();
      return `<div class="eyebrow">Step 1 of 4 · compatibility truth</div><h2>Select the exact template you used</h2><p class="muted">Choose the Active Template Variant from Tesla's published catalog—not a guessed trim or a generic compatibility claim.</p>${templateCards()}${t.note?`<div class="notice warn" style="margin-top:14px">${t.note} WrapForge does not infer the missing boundary.</div>`:''}${navActions(1)}`;
    }
    function fileStep() {
      const s=current(); const sc=scenario();
      return `<div class="eyebrow">Step 2 of 4 · private asset</div><h2>Upload the PNG for ${chosenTemplate().name}</h2><p class="muted">A private, owner-scoped Pending Upload receives at most 1 MB. No filename becomes a storage key.</p>
      <div class="file-zone"><div><div class="file-icon"></div><h3>${safe(sc.file)}</h3><p class="muted">${sc.size} · ${sc.dims}</p><span class="tag">staging/${safe(s.uploadId)}/random-key</span></div></div>
      <div class="scenario-row"><select id="scenario" aria-label="Prototype file scenario">${Object.entries(scenarios).map(([id,v])=>`<option value="${id}" ${s.scenario===id?'selected':''}>${v.label}</option>`).join('')}</select><button class="primary" data-run-validation>Run validation</button></div>
      ${errorNotice()}${validationRows()}
      ${['preflight-failed','validation-failed','expired'].includes(s.phase)?`<button class="secondary" style="margin-top:14px" data-retry>Start a fresh Pending Upload</button>`:''}
      ${navActions(2, !['ready','published','unpublished'].includes(s.phase))}`;
    }
    function metadataFields() {
      const s=current();
      return `<div style="display:grid;gap:15px"><div class="field"><label for="title">Title <span class="counter">${s.title.length}/80</span></label><input id="title" maxlength="80" value="${safe(s.title)}" /></div>
      <div class="field"><label for="description">Description <span class="counter">${s.description.length}/2000</span></label><textarea id="description" maxlength="2000">${safe(s.description)}</textarea></div>
      <div class="pipeline-grid"><div class="field"><label for="tags">Tags · up to 10</label><input id="tags" value="neon, oni, night" /></div><div class="field"><label for="license">License</label><select id="license"><option ${s.license==='Personal Use Allowed'?'selected':''}>Personal Use Allowed</option><option ${s.license==='Creative Commons'?'selected':''}>Creative Commons</option><option ${s.license==='Other'?'selected':''}>Other</option></select></div></div>
      <label class="checkbox"><input id="template-confirm" type="checkbox" ${s.templateConfirm?'checked':''}/><span>I used Tesla's published <strong>${chosenTemplate().name}</strong> template for this artwork. I understand dimensions alone do not prove alignment or Tesla acceptance.</span></label>
      <label class="checkbox"><input id="rights" type="checkbox" ${s.rights?'checked':''}/><span>I own this design or have permission to share it under the selected license.</span></label></div>`;
    }
    function detailsStep() {
      return `<div class="eyebrow">Step 3 of 4 · attribution and rights</div><h2>Tell the community what you made</h2><p class="muted">Plain-text metadata remains editable. Replacing the PNG or Template Variant starts a new immutable Asset Revision.</p>${metadataFields()}${navActions(3, !(current().rights&&current().templateConfirm&&current().title.trim()))}`;
    }
    function previewBlock() {
      const s=current(); const t=chosenTemplate(); const r=readiness();
      return `<div class="art-preview"></div><div style="margin-top:18px"><div class="eyebrow">Public Wrap preview</div><h2 style="margin-bottom:8px">${safe(s.title || 'Untitled Wrap')}</h2><p class="muted">by kai.wraps · ${safe(s.description)}</p><div class="compat"><strong>Built for Tesla's published ${t.name} template</strong>${t.dims} · catalog verified ${t.verified}<br><small>Paint Shop availability varies by vehicle, configuration, account, software, and region. Check Paint Shop in your vehicle.</small></div>
      <div class="gate-list">${['Active Template Variant selected','Immutable Asset Revision complete','Required metadata complete','Template assertion confirmed','Rights confirmed'].map((label,i)=>`<span class="gate ${r.gates[i]?'ok':''}">${label}</span>`).join('')}</div>
      ${s.phase==='published'?`<div class="publish-result"><strong>Published</strong><br>This Wrap is now in the public Discovery Set at <code>/wrap/oni-after-midnight</code>.</div>`:''}
      ${s.phase==='unpublished'?`<div class="notice warn"><strong>Unpublished</strong><br>This Wrap is Creator-only. Its immutable assets and existing metrics were preserved.</div>`:''}</div>`;
    }
    function publishActions() {
      const s=current(); const r=readiness();
      if (s.phase==='published') return `<div class="actions"><button class="ghost" data-step="3">Edit details</button><div class="actions-end"><button class="danger-btn" data-unpublish>Unpublish</button><button class="secondary" disabled>Published ✓</button></div></div>`;
      return `<div class="actions"><button class="ghost" data-step="3">Back</button><div class="actions-end"><button class="secondary" data-step="2">Replace PNG</button><button class="primary" data-publish ${r.ready?'':'disabled'}>${s.phase==='unpublished'?'Republish Wrap':'Publish Wrap'}</button></div></div>`;
    }
    function publishStep() { return `<div class="eyebrow">Step 4 of 4 · public boundary</div><h2>Preview the exact public claim</h2><p class="muted">Publishing rechecks every gate in one server transaction. It never turns READY into a public Wrap from browser state alone.</p>${previewBlock()}${publishActions()}`; }
    function stepBody(step=current().step) { return [null,vehicleStep,fileStep,detailsStep,publishStep][step](); }
    function navActions(step, disabled=false) {
      return `<div class="actions">${step>1?`<button class="ghost" data-step="${step-1}">Back</button>`:'<span></span>'}<div class="actions-end">${step<4?`<button class="primary" data-step="${step+1}" ${disabled?'disabled':''}>Continue</button>`:''}</div></div>`;
    }
    function summary() {
      const s=current(); const t=chosenTemplate();
      return `<aside class="studio-summary panel"><div class="art-preview summary-art"></div><div class="eyebrow">Wrap summary</div><h3>${safe(s.title || 'Untitled Wrap')}</h3><div class="summary-list"><div class="summary-row"><span>Template</span><strong>${t.name}</strong></div><div class="summary-row"><span>Dimensions</span><strong>${t.dims}</strong></div><div class="summary-row"><span>Asset</span><strong>${['ready','published','unpublished'].includes(s.phase)?'rev_01 ready':'Not ready'}</strong></div><div class="summary-row"><span>Visibility</span><strong>${s.phase==='published'?'Public':s.phase==='unpublished'?'Creator only':'Not published'}</strong></div></div><span class="tag active">Catalog verified ${t.verified}</span></aside>`;
    }
    function variantA() {
      return `<div class="variant-a">${header()}<main class="studio-shell"><aside class="studio-rail panel"><h2>Create a Wrap</h2><p class="muted">One focused decision at a time.</p>${steps.map(st=>`<button class="rail-step" data-step="${st.id}">${stepDot(st)}<span><strong>${st.short}</strong><small>${st.title}</small></span></button>`).join('')}</aside><section class="studio-work panel">${stepBody()}</section>${summary()}</main></div>`;
    }
    function pipelineInspector() {
      const s=current(); const r=readiness();
      return `<aside class="pipeline-inspector panel"><div><div class="eyebrow">Trust boundary</div><h3>Browser ≠ publication authority</h3><div class="trust-boundary"><strong>Client</strong>Preflight and owner-scoped direct upload provide fast feedback.</div><div class="trust-boundary"><strong>Server</strong>Re-fetches staged bytes, validates, normalizes, derives, and atomically publishes.</div></div><div><div class="eyebrow">Current gate</div><div class="readiness-score" style="width:74px;height:74px;font-size:19px">${r.score}%</div><p class="muted">Pending Upload <code>${s.uploadId}</code><br>Phase: <strong>${s.phase}</strong></p></div></aside>`;
    }
    function variantB() {
      const s=current();
      return `<div class="variant-b">${header()}<main class="pipeline-shell"><header class="pipeline-head"><div><div class="eyebrow">Creator pipeline · private to public</div><h1>Move one verified asset through the gates.</h1><p class="muted">The system shows where fast browser feedback ends and authoritative validation begins.</p></div><span class="tag active">Pending Upload ${s.uploadId}</span></header><nav class="pipeline-stages" aria-label="Upload stages">${steps.map(st=>`<button class="pipeline-stage ${s.step===st.id?'active':''}" data-step="${st.id}">${stepDot(st)}<span><strong>${st.short}</strong><br><small class="muted">${st.title}</small></span></button>`).join('')}</nav><div class="pipeline-body"><section class="pipeline-command panel">${stepBody()}</section>${pipelineInspector()}</div></main></div>`;
    }
    function sectionSummary(id) {
      const s=current(); const t=chosenTemplate();
      if (id===1) return `${t.name} · ${t.dims}`;
      if (id===2) return ['ready','published','unpublished'].includes(s.phase)?'Template-verified Asset Revision ready':s.phase==='idle'?'No validation yet':s.phase.replaceAll('-',' ');
      if (id===3) return s.rights&&s.templateConfirm&&s.title.trim()?'Metadata and assertions complete':'Needs confirmation';
      return s.phase==='published'?'Published in Discovery Set':s.phase==='unpublished'?'Creator-only':'Not published';
    }
    function readinessPanel() {
      const s=current(); const r=readiness();
      return `<aside class="readiness panel"><div class="eyebrow">Publication readiness</div><h3>${r.ready?'Ready for server recheck':'Complete every gate'}</h3><div class="readiness-score">${r.score}%</div><div class="gate-list">${['Template selected','Asset Revision ready','Metadata complete','Rights confirmed','Template confirmed'].map((label,i)=>`<span class="gate ${r.gates[i]?'ok':''}">${label}</span>`).join('')}</div>${s.phase==='published'?`<button class="danger-btn" style="width:100%" data-unpublish>Unpublish</button>`:`<button class="primary" style="width:100%" data-publish ${r.ready?'':'disabled'}>${s.phase==='unpublished'?'Republish Wrap':'Publish Wrap'}</button>`}<p class="hint" style="margin-top:13px">Publish performs a fresh server transaction. This panel never grants authority.</p></aside>`;
    }
    function variantC() {
      const s=current();
      const checklistBody = id => id === 4
        ? `<div class="eyebrow">Step 4 of 4 · public boundary</div><h2>Preview the exact public claim</h2><p class="muted">The single Publish action stays in the readiness inspector, which performs a fresh server recheck.</p>${previewBlock()}`
        : stepBody(id);
      return `<div class="variant-c">${header()}<header class="checklist-head"><div><div class="eyebrow">Creator checklist · everything visible</div><h1>Know exactly what blocks publication.</h1><p class="muted">Open any requirement, repair it in place, and watch the server-ready checklist change.</p></div></header><main class="checklist-shell"><section class="check-stack">${steps.map(st=>`<article class="check-section"><button class="check-head" data-step="${st.id}">${stepDot(st,s.step===st.id?'current':'')}<span class="check-head-copy"><strong>${st.title}</strong><small>${sectionSummary(st.id)}</small></span></button>${s.step===st.id?`<div class="check-content">${checklistBody(st.id)}</div>`:''}</article>`).join('')}</section>${readinessPanel()}</main></div>`;
    }
    function switcher() {
      const s=current();
      return `<div class="prototype-bar" role="toolbar" aria-label="Prototype variants"><button data-cycle="-1" aria-label="Previous variant">←</button><span class="prototype-label">${s.variant} — ${variants[s.variant]}</span><button data-cycle="1" aria-label="Next variant">→</button><button class="state-toggle" data-state>${s.stateOpen?'Hide':'State'}</button></div><pre class="state-panel ${s.stateOpen?'open':''}">${safe(JSON.stringify({...s, chosenTemplate:chosenTemplate(), sampleFile:scenario(), readiness:readiness()},null,2))}</pre>`;
    }
    function render() {
      const s=current(); document.body.className=`prototype variant-${s.variant.toLowerCase()}`;
      document.getElementById('app').innerHTML = (s.variant==='A'?variantA():s.variant==='B'?variantB():variantC()) + switcher();
      bind();
    }
    function runValidation() {
      const s=current();
      if (['tooLarge','wrongFormat'].includes(s.scenario) || scenario().dims!==chosenTemplate().dims) patch({phase:'preflight-failed'});
      else if (s.scenario==='serverFailure') patch({phase:'validation-failed'});
      else if (s.scenario==='expired') patch({phase:'expired'});
      else patch({phase:'ready'});
    }
    function bind() {
      document.querySelectorAll('[data-step]').forEach(el=>el.addEventListener('click',()=>patch({step:el.dataset.step})));
      document.querySelectorAll('[data-template]').forEach(el=>el.addEventListener('click',()=>patch({template:el.dataset.template,phase:'idle'})));
      document.querySelectorAll('[data-cycle]').forEach(el=>el.addEventListener('click',()=>cycle(Number(el.dataset.cycle))));
      document.querySelectorAll('[data-run-validation]').forEach(el=>el.addEventListener('click',runValidation));
      document.querySelectorAll('[data-retry]').forEach(el=>el.addEventListener('click',()=>patch({phase:'idle',scenario:chosenTemplate().dims==='1024 × 768'?'validCybertruck':'valid',uploadId:`up_${Math.random().toString(36).slice(2,8).toUpperCase()}`})));
      document.querySelectorAll('[data-publish]').forEach(el=>el.addEventListener('click',()=>patch({phase:'published',step:4})));
      document.querySelectorAll('[data-unpublish]').forEach(el=>el.addEventListener('click',()=>patch({phase:'unpublished',step:4})));
      document.querySelectorAll('[data-state]').forEach(el=>el.addEventListener('click',()=>patch({state:current().stateOpen?null:'open'})));
      const scenarioEl=document.getElementById('scenario'); if(scenarioEl) scenarioEl.addEventListener('change',e=>patch({scenario:e.target.value,phase:'idle'}));
      const title=document.getElementById('title'); if(title) title.addEventListener('change',e=>patch({title:e.target.value}));
      const desc=document.getElementById('description'); if(desc) desc.addEventListener('change',e=>patch({description:e.target.value}));
      const license=document.getElementById('license'); if(license) license.addEventListener('change',e=>patch({license:e.target.value}));
      const rights=document.getElementById('rights'); if(rights) rights.addEventListener('change',e=>patch({rights:e.target.checked?'1':'0'}));
      const tc=document.getElementById('template-confirm'); if(tc) tc.addEventListener('change',e=>patch({templateConfirm:e.target.checked?'1':'0'}));
    }
    function cycle(direction) { const keys=Object.keys(variants); const i=keys.indexOf(current().variant); patch({variant:keys[(i+direction+keys.length)%keys.length]},true); }
    addEventListener('keydown',e=>{ if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return; if(e.key==='ArrowLeft')cycle(-1); if(e.key==='ArrowRight')cycle(1); });
    addEventListener('popstate',render);
    render();
  </script>
</body>
</html>
