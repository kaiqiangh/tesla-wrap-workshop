<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='4' width='22' height='24' rx='8' fill='%238cf7d5'/%3E%3Cpath d='M10 11h12L10 21h12' fill='none' stroke='%2305221a' stroke-width='3'/%3E%3C/svg%3E" />
  <title>WrapForge guest journey prototype</title>
  <style>
    :root {
      --bg: #07090d;
      --surface: #10141b;
      --surface-2: #171d27;
      --line: rgba(255,255,255,.12);
      --muted: #a7afbd;
      --text: #f7f8fb;
      --accent: #8cf7d5;
      --hot: #ff6b9a;
      --warn: #ffcf70;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-width: 320px; background: radial-gradient(circle at 85% -10%, rgba(71,86,255,.17), transparent 34rem), var(--bg); }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    .shell { min-height: 100vh; padding-bottom: 104px; }
    .topbar { min-height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; border-bottom: 1px solid var(--line); backdrop-filter: blur(18px); position: sticky; top: 0; z-index: 20; background: rgba(7,9,13,.82); }
    .brand { display: inline-flex; gap: 10px; align-items: center; font-weight: 800; letter-spacing: -.03em; border: 0; background: none; cursor: pointer; font-size: 18px; }
    .brand-mark { width: 27px; height: 27px; border: 2px solid var(--accent); border-radius: 9px 4px 9px 4px; transform: rotate(-8deg); box-shadow: inset 0 0 0 4px rgba(140,247,213,.08); }
    .nav { display: flex; align-items: center; gap: 8px; }
    .nav button, .ghost { border: 1px solid transparent; background: transparent; padding: 10px 13px; border-radius: 999px; cursor: pointer; }
    .nav button:hover, .ghost:hover { border-color: var(--line); background: rgba(255,255,255,.04); }
    .primary { background: var(--accent); color: #05221a; border: 0; padding: 12px 18px; border-radius: 999px; font-weight: 800; cursor: pointer; }
    .nav .primary { background: var(--accent); border-color: var(--accent); color: #05221a; }
    .primary:hover { filter: brightness(1.05); }
    .secondary { background: rgba(255,255,255,.07); border: 1px solid var(--line); padding: 12px 18px; border-radius: 999px; font-weight: 700; cursor: pointer; }
    main { width: min(1440px, 100%); margin: 0 auto; }
    .eyebrow { text-transform: uppercase; letter-spacing: .16em; color: var(--accent); font-weight: 800; font-size: 11px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(40px, 7vw, 92px); line-height: .94; letter-spacing: -.065em; }
    h2 { font-size: clamp(27px, 4vw, 46px); letter-spacing: -.045em; }
    h3 { letter-spacing: -.025em; }
    .muted { color: var(--muted); }
    .section { padding: 54px 5vw; }
    .section-head { display: flex; gap: 20px; align-items: end; justify-content: space-between; margin-bottom: 24px; }
    .section-head h2 { margin-bottom: 0; }
    .art { min-height: 240px; border-radius: var(--radius); position: relative; overflow: hidden; background: var(--art); isolation: isolate; }
    .art::before, .art::after { content: ""; position: absolute; inset: -20%; background: repeating-linear-gradient(115deg, transparent 0 11%, rgba(255,255,255,.15) 11% 11.7%, transparent 11.7% 21%); transform: rotate(-7deg); mix-blend-mode: overlay; }
    .art::after { inset: 35% -10% -20% 20%; border: 1px solid rgba(255,255,255,.3); border-radius: 50% 0 0 0; background: rgba(4,7,14,.55); filter: blur(1px); }
    .art-label { position: absolute; left: 16px; bottom: 14px; z-index: 2; padding: 7px 10px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; background: rgba(5,7,12,.72); border: 1px solid rgba(255,255,255,.15); backdrop-filter: blur(10px); }
    .card { cursor: pointer; min-width: 0; }
    .card .art { transition: transform .25s ease, box-shadow .25s ease; }
    .card:hover .art { transform: translateY(-3px); box-shadow: 0 22px 60px rgba(0,0,0,.35); }
    .card-copy { padding: 14px 2px; }
    .card-copy h3 { margin-bottom: 8px; font-size: 18px; }
    .meta-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
    .dot::before { content: "•"; margin-right: 10px; color: #505866; }
    .avatar { width: 25px; height: 25px; border-radius: 50%; background: linear-gradient(135deg, var(--hot), #696cff); display: inline-grid; place-items: center; color: white; font-size: 10px; font-weight: 900; }
    .compat { border: 1px solid rgba(140,247,213,.25); background: rgba(140,247,213,.07); color: #d8fff3; padding: 10px 12px; border-radius: 12px; font-size: 12px; line-height: 1.4; }
    .badge { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 6px 9px; color: var(--muted); font-size: 11px; }
    .models { display: flex; gap: 10px; overflow: auto; padding: 3px 0 12px; scrollbar-width: none; }
    .model-chip { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 11px 16px; cursor: pointer; }
    .model-chip.active { color: #07130f; background: var(--accent); border-color: var(--accent); font-weight: 800; }
    .filters { display: grid; grid-template-columns: minmax(180px, 1fr) repeat(3, minmax(135px, .35fr)); gap: 10px; margin: 22px 0 28px; }
    .filters input, .filters select { width: 100%; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; outline: none; }
    .filters input:focus, .filters select:focus { border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 20px; }
    .grid .card:nth-child(5n+1) .art { min-height: 330px; }
    .prototype-bar { position: fixed; z-index: 80; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 7px; padding: 7px; border-radius: 999px; background: #f8fafc; color: #080b10; box-shadow: 0 12px 50px rgba(0,0,0,.55); white-space: nowrap; }
    .prototype-bar button { width: 37px; height: 37px; border: 0; border-radius: 50%; background: #e7ebf1; color: #080b10; font-weight: 900; cursor: pointer; }
    .prototype-label { min-width: 205px; text-align: center; font-size: 13px; font-weight: 850; }
    .state-toggle { width: auto !important; padding: 0 12px; border-radius: 999px !important; }
    .state-panel { position: fixed; z-index: 75; right: 18px; bottom: 78px; width: min(380px, calc(100vw - 36px)); max-height: 55vh; overflow: auto; padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(8,11,16,.96); box-shadow: 0 18px 60px #000; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; display: none; }
    .state-panel.open { display: block; }
    .modal-backdrop { position: fixed; z-index: 60; inset: 0; background: rgba(0,0,0,.72); display: grid; place-items: center; padding: 18px; backdrop-filter: blur(8px); }
    .modal { width: min(560px, 100%); max-height: 90vh; overflow: auto; border: 1px solid var(--line); border-radius: 24px; background: #11161e; padding: 28px; box-shadow: 0 30px 100px #000; }
    .modal ol { padding-left: 22px; color: var(--muted); line-height: 1.65; }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .detail-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .stats { display: flex; gap: 18px; color: var(--muted); font-size: 13px; }
    .stats strong { color: var(--text); font-size: 17px; }
    .mobile-download { display: none; }

    /* Variant A — cinematic editorial */
    .variant-a .hero { padding: 42px 5vw 20px; display: grid; grid-template-columns: .9fr 1.1fr; min-height: 72vh; gap: 40px; align-items: center; }
    .variant-a .hero-copy { max-width: 660px; }
    .variant-a .hero-copy p { color: var(--muted); max-width: 570px; font-size: 18px; line-height: 1.6; }
    .variant-a .hero-art { min-height: 62vh; box-shadow: 0 30px 100px rgba(0,0,0,.45); }
    .variant-a .hero-actions { display: flex; gap: 10px; margin-top: 28px; }
    .variant-a .mosaic { display: grid; grid-template-columns: 1.3fr .7fr .7fr; gap: 16px; }
    .variant-a .mosaic .card:first-child { grid-row: span 2; }
    .variant-a .mosaic .card:first-child .art { min-height: 560px; }
    .variant-a .mosaic .art { min-height: 230px; }
    .variant-a .detail { padding: 46px 5vw; display: grid; grid-template-columns: minmax(0,1.15fr) minmax(340px,.85fr); gap: 52px; align-items: start; }
    .variant-a .detail > .art { min-height: 74vh; position: sticky; top: 98px; }
    .variant-a .detail-copy { padding-top: 18px; }

    /* Variant B — compatibility navigator */
    .variant-b { --accent: #b7ff45; --surface: #11150f; --surface-2: #171d12; background: linear-gradient(90deg, rgba(183,255,69,.035) 1px, transparent 1px), linear-gradient(rgba(183,255,69,.035) 1px, transparent 1px); background-size: 42px 42px; }
    .variant-b .navigator { display: grid; grid-template-columns: 290px minmax(0,1fr); min-height: calc(100vh - 72px); }
    .variant-b .side { border-right: 1px solid var(--line); padding: 32px 24px 120px 5vw; position: sticky; top: 72px; height: calc(100vh - 72px); }
    .variant-b .side h1 { font-size: 42px; margin: 12px 0 28px; }
    .variant-b .side .model-chip { width: 100%; text-align: left; margin-bottom: 8px; border-radius: 10px; }
    .variant-b .workspace { padding: 38px 5vw 80px 34px; }
    .variant-b .workspace-head { display: flex; justify-content: space-between; gap: 28px; align-items: end; }
    .variant-b .workspace-head h2 { margin-bottom: 6px; }
    .variant-b .grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 15px; }
    .variant-b .card { display: grid; grid-template-columns: 42% 1fr; gap: 15px; padding: 11px; border: 1px solid var(--line); background: rgba(10,14,9,.84); border-radius: 16px; }
    .variant-b .card .art { min-height: 190px !important; }
    .variant-b .card-copy { display: flex; flex-direction: column; padding: 6px 4px 5px 0; }
    .variant-b .card-copy .compat { margin-top: auto; }
    .variant-b .detail { padding: 38px 5vw; display: grid; grid-template-columns: minmax(0,1fr) 420px; gap: 26px; }
    .variant-b .detail > .art { min-height: 70vh; }
    .variant-b .detail-copy { border: 1px solid var(--line); background: rgba(13,17,12,.9); border-radius: 20px; padding: 26px; }
    .variant-b .compat-large { border: 1px solid rgba(183,255,69,.35); background: rgba(183,255,69,.09); padding: 18px; border-radius: 14px; margin: 22px 0; }

    /* Variant C — creator magazine */
    .variant-c { --accent: #ffcf70; --surface: #17130e; --surface-2: #201a13; background: #0e0c0a; }
    .variant-c .topbar { background: rgba(14,12,10,.88); }
    .variant-c .mag-hero { padding: 64px 5vw 28px; border-bottom: 1px solid var(--line); }
    .variant-c .mag-hero h1 { max-width: 1050px; }
    .variant-c .mag-hero p { max-width: 720px; font-size: 20px; line-height: 1.6; color: var(--muted); }
    .variant-c .story-row { display: grid; grid-template-columns: 220px minmax(0,1fr); border-bottom: 1px solid var(--line); }
    .variant-c .story-kicker { padding: 40px 26px 40px 5vw; border-right: 1px solid var(--line); }
    .variant-c .story-content { padding: 40px 5vw 40px 30px; display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 18px; }
    .variant-c .story-content .art { min-height: 300px; border-radius: 4px; }
    .variant-c .card-copy { padding-top: 15px; }
    .variant-c .detail { width: min(1040px, 100%); margin: 0 auto; padding: 48px 5vw; }
    .variant-c .detail > .art { min-height: min(66vh, 720px); border-radius: 5px; }
    .variant-c .detail-copy { display: grid; grid-template-columns: 1fr 330px; gap: 44px; padding-top: 34px; }
    .variant-c .detail-aside { border-left: 1px solid var(--line); padding-left: 28px; }

    @media (max-width: 960px) {
      .nav .hide-mobile { display: none; }
      .grid, .variant-b .grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .variant-a .hero { grid-template-columns: 1fr; }
      .variant-a .hero-art { min-height: 55vh; }
      .variant-a .mosaic { grid-template-columns: 1fr 1fr; }
      .variant-a .mosaic .card:first-child { grid-column: span 2; grid-row: auto; }
      .variant-a .mosaic .card:first-child .art { min-height: 420px; }
      .variant-a .detail, .variant-b .detail { grid-template-columns: 1fr; }
      .variant-a .detail > .art { position: relative; top: auto; min-height: 55vh; }
      .variant-b .navigator { grid-template-columns: 1fr; }
      .variant-b .side { position: static; width: 100%; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 28px 5vw; }
      .variant-b .side .models { display: flex; }
      .variant-b .side .model-chip { width: auto; }
      .variant-b .workspace { padding: 32px 5vw 80px; }
      .variant-c .story-row { grid-template-columns: 1fr; }
      .variant-c .story-kicker { border-right: 0; padding-bottom: 8px; }
      .variant-c .story-content { padding-top: 15px; }
    }
    @media (max-width: 640px) {
      .topbar { padding: 0 18px; min-height: 62px; }
      .nav .ghost, .nav .hide-mobile { display: none; }
      .section, .variant-a .hero, .variant-a .detail, .variant-b .detail, .variant-c .detail { padding-left: 18px; padding-right: 18px; }
      h1 { font-size: 46px; }
      .grid, .variant-b .grid, .variant-c .story-content { grid-template-columns: 1fr; }
      .filters { grid-template-columns: 1fr 1fr; }
      .filters input { grid-column: span 2; }
      .variant-a .hero { min-height: auto; padding-top: 36px; }
      .variant-a .hero-art { min-height: 48vh; }
      .variant-a .mosaic { grid-template-columns: 1fr; }
      .variant-a .mosaic .card:first-child { grid-column: auto; }
      .variant-a .mosaic .card:first-child .art { min-height: 380px; }
      .variant-b .workspace-head { align-items: start; flex-direction: column; }
      .variant-b .card { grid-template-columns: 40% 1fr; }
      .variant-b .card .art { min-height: 165px !important; }
      .variant-b .card-copy .meta-row { display: none; }
      .variant-c .mag-hero { padding: 42px 18px 22px; }
      .variant-c .story-kicker, .variant-c .story-content { padding-left: 18px; padding-right: 18px; }
      .variant-c .detail-copy { grid-template-columns: 1fr; }
      .variant-c .detail-aside { border-left: 0; border-top: 1px solid var(--line); padding: 24px 0 0; }
      .detail-actions .primary { width: 100%; }
      .detail-actions [data-download] { display: none; }
      .mobile-download { display: block; position: fixed; left: 0; right: 0; bottom: 62px; z-index: 30; margin: 0; padding: 26px 18px 8px; background: linear-gradient(transparent, rgba(7,9,13,.96) 42%); }
      .mobile-download .primary { width: 100%; box-shadow: 0 10px 35px rgba(0,0,0,.5); }
      .prototype-label { min-width: 142px; }
      .prototype-bar { max-width: calc(100vw - 18px); bottom: 9px; }
      .prototype-bar .state-toggle { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // PROTOTYPE: Three guest-journey UI variants, switchable with ?variant=, on a standalone throwaway route.
    const variants = {
      A: 'Artwork editorial',
      B: 'Compatibility navigator',
      C: 'Creator magazine'
    };
    const wraps = [
      { id:'oni-night', title:'Oni After Midnight', creator:'maya.works', initials:'MW', model:'Model Y', variant:'Model Y (2025+) Premium', likes:812, downloads:2406, tag:'Trending #1', art:'linear-gradient(145deg,#ff335f 0%,#8e2de2 42%,#121832 42%,#07111f 100%)' },
      { id:'alpine-grid', title:'Alpine Grid', creator:'northline', initials:'NL', model:'Model 3', variant:'Model 3 (2024+) Standard & Premium', likes:476, downloads:1298, tag:'New this week', art:'linear-gradient(140deg,#e8f3ff 0%,#9dd4f7 36%,#25344e 36%,#101521 62%,#ff7b40 62%)' },
      { id:'signal-bloom', title:'Signal Bloom', creator:'studio.six', initials:'S6', model:'Model S', variant:'Model S (2025+) Plaid', likes:631, downloads:1750, tag:'Editor pick', art:'radial-gradient(circle at 30% 35%,#fff85b 0 8%,#ff6888 9% 23%,transparent 24%),linear-gradient(135deg,#5623b5,#071226 68%)' },
      { id:'lunar-dust', title:'Lunar Dust', creator:'kepler', initials:'KP', model:'Cybertruck', variant:'Cybertruck', likes:324, downloads:988, tag:'1024 × 768', art:'linear-gradient(120deg,#1b2638,#788696 44%,#26303e 45% 66%,#d6b98b 67%)' },
      { id:'kinetic-poppy', title:'Kinetic Poppy', creator:'mono.chrome', initials:'MC', model:'Model X', variant:'Model X (2021+)', likes:258, downloads:734, tag:'Most liked', art:'repeating-linear-gradient(120deg,#ff4b36 0 9%,#151414 9% 17%,#f7dbc7 17% 23%)' },
      { id:'deep-current', title:'Deep Current', creator:'rhea', initials:'RH', model:'Model Y', variant:'Model Y (2025+) Performance', likes:193, downloads:521, tag:'Latest', art:'radial-gradient(ellipse at 80% 20%,#59ffc3 0 8%,transparent 9%),linear-gradient(145deg,#03192b,#054b66 55%,#5c3aa8)' }
    ];

    const params = () => new URLSearchParams(location.search);
    const state = () => ({
      variant: variants[params().get('variant')] ? params().get('variant') : 'A',
      screen: ['home','explore','detail'].includes(params().get('screen')) ? params().get('screen') : 'home',
      wrap: params().get('wrap') || wraps[0].id,
      model: params().get('model') || 'All models',
      sort: params().get('sort') || 'Trending',
      query: params().get('q') || '',
      downloadDialog: params().get('download') === 'ready'
    });
    function setParams(next, replace = false) {
      const url = new URL(location.href);
      Object.entries(next).forEach(([key,value]) => value === null ? url.searchParams.delete(key) : url.searchParams.set(key,value));
      history[replace ? 'replaceState' : 'pushState']({},'',url);
      render();
    }
    function selectedWrap() { return wraps.find(w => w.id === state().wrap) || wraps[0]; }
    function visibleWraps() {
      const s = state();
      return wraps.filter(w => (s.model === 'All models' || w.model === s.model) && (!s.query || `${w.title} ${w.creator} ${w.variant}`.toLowerCase().includes(s.query.toLowerCase())));
    }
    function art(w, cls='') { return `<div class="art ${cls}" style="--art:${w.art}"><span class="art-label">${w.tag}</span></div>`; }
    function card(w, showCompat=true) {
      return `<article class="card" tabindex="0" role="link" aria-label="Open ${w.title}" data-open-wrap="${w.id}">
        ${art(w)}
        <div class="card-copy">
          <h3>${w.title}</h3>
          <div class="meta-row"><span class="avatar">${w.initials}</span><span>${w.creator}</span><span class="dot">♡ ${w.likes}</span><span class="dot">↓ ${w.downloads.toLocaleString()}</span></div>
          ${showCompat ? `<div class="compat" style="margin-top:12px"><strong>Built for</strong><br>${w.variant}</div>` : ''}
        </div>
      </article>`;
    }
    function header() {
      return `<header class="topbar">
        <button class="brand" data-screen="home"><span class="brand-mark"></span>WrapForge</button>
        <nav class="nav" aria-label="Primary">
          <button class="ghost hide-mobile" data-screen="explore">Explore</button>
          <button class="ghost hide-mobile" data-screen="explore" data-sort="Trending">Trending</button>
          <button class="primary">Upload a Wrap</button>
        </nav>
      </header>`;
    }
    function modelChips() {
      return `<div class="models">${['All models','Model 3','Model Y','Model S','Model X','Cybertruck'].map(m => `<button class="model-chip ${state().model===m?'active':''}" data-model="${m}">${m}</button>`).join('')}</div>`;
    }
    function filters() {
      return `<div class="filters">
        <input id="search" value="${state().query.replaceAll('&','&amp;').replaceAll('"','&quot;')}" placeholder="Search wraps, tags, creators" aria-label="Search wraps" />
        <select id="model" aria-label="Vehicle model">${['All models','Model 3','Model Y','Model S','Model X','Cybertruck'].map(m=>`<option ${state().model===m?'selected':''}>${m}</option>`).join('')}</select>
        <select aria-label="Template variant"><option>All variants</option><option>2025+ Premium</option><option>2025+ Performance</option></select>
        <select id="sort" aria-label="Sort wraps">${['Trending','Newest','Most Downloaded'].map(v=>`<option ${state().sort===v?'selected':''}>${v}</option>`).join('')}</select>
      </div>`;
    }
    function homeA() {
      const w=wraps[0];
      return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Custom art for Tesla Paint Shop</div><h1>Find a wrap that feels like yours.</h1><p>Explore creator-made PNG artwork built for exact published Tesla template variants. Download it, then add it manually in the Tesla app.</p><div class="hero-actions"><button class="primary" data-screen="explore">Explore Wraps</button><button class="secondary">Upload a Wrap</button></div></div>${art(w,'hero-art')}</section>
      <section class="section"><div class="section-head"><div><div class="eyebrow">Browse confidently</div><h2>Choose your model</h2></div></div>${modelChips()}</section>
      <section class="section"><div class="section-head"><div><div class="eyebrow">Past seven days</div><h2>Trending now</h2></div><button class="ghost" data-screen="explore">View all →</button></div><div class="mosaic">${wraps.slice(0,5).map(w=>card(w,false)).join('')}</div></section>`;
    }
    function homeB() {
      return `<div class="navigator"><aside class="side"><div class="eyebrow">Start with fit</div><h1>Your exact template first.</h1><p class="muted">Choose the Tesla model family, then confirm the published Template Variant before download.</p>${modelChips()}<div class="compat" style="margin-top:22px">Availability varies by vehicle, configuration, software, account, and region. Check Paint Shop in your vehicle.</div></aside><section class="workspace"><div class="workspace-head"><div><div class="eyebrow">Verified catalog</div><h2>Trending Custom Wraps</h2><p class="muted">Exact Template Variant shown on every result.</p></div><button class="secondary" data-screen="explore">All filters</button></div>${filters()}<div class="grid">${visibleWraps().map(w=>card(w,true)).join('')}</div></section></div>`;
    }
    function homeC() {
      return `<section class="mag-hero"><div class="eyebrow">Independent creators. Exact templates.</div><h1>Artwork made to move from screen to screen.</h1><p>Meet the people building visual identities for Tesla Paint Shop—then check the exact template, download the PNG, and bring it into the Tesla app yourself.</p><button class="primary" data-screen="explore">Browse the issue</button></section>
      <section class="story-row"><aside class="story-kicker"><div class="eyebrow">01 / Trending</div><h3>Most downloaded this week</h3></aside><div class="story-content">${wraps.slice(0,3).map(w=>card(w,false)).join('')}</div></section>
      <section class="story-row"><aside class="story-kicker"><div class="eyebrow">02 / New voices</div><h3>Fresh from creators</h3></aside><div class="story-content">${wraps.slice(3,6).map(w=>card(w,false)).join('')}</div></section>`;
    }
    function explore(variant) {
      if (variant==='B') return homeB();
      return `<section class="section"><div class="section-head"><div><div class="eyebrow">Public discovery set</div><h1 style="font-size:clamp(48px,7vw,88px);margin:10px 0">Explore Wraps</h1><p class="muted">Published artwork only. Exact Template Variant on every card.</p></div></div>${filters()}<div class="grid">${visibleWraps().map(w=>card(w,variant!=='C')).join('') || '<div><h3>No wraps match</h3><p class="muted">Keep your filters, or clear them to see everything.</p></div>'}</div></section>`;
    }
    function detail(variant) {
      const w=selectedWrap();
      const mainCopy = `<div class="eyebrow">Creator-made Custom Wrap</div><h1 style="font-size:clamp(46px,6vw,76px);margin:12px 0 16px">${w.title}</h1><div class="meta-row"><span class="avatar">${w.initials}</span><strong>${w.creator}</strong><span class="dot">Published 4 days ago</span></div><p class="muted" style="font-size:17px;line-height:1.65;margin:24px 0">A high-contrast composition tuned for the selected official template. Plain-text description, no claims of Tesla approval or guaranteed vehicle availability.</p><div class="stats"><span><strong>${w.likes}</strong><br>Likes</span><span><strong>${w.downloads.toLocaleString()}</strong><br>Downloads</span></div>`;
      const compatibility = `<div class="compat-large"><div class="eyebrow" style="color:var(--accent)">Compatibility claim</div><h3 style="margin:9px 0 5px">Built for Tesla's published template</h3><strong>${w.variant}</strong><p class="muted" style="margin:10px 0 0;font-size:13px">Template dimensions verified · Catalog checked 9 Aug 2026</p></div>`;
      const caveat = `<div class="compat"><strong>Check Paint Shop on your vehicle</strong><br>Availability varies by vehicle, configuration, account, software, and region. This is not Tesla certification.</div>`;
      const actions = `<div class="detail-actions" style="margin:22px 0"><button class="primary" data-download>Download Wrap</button><button class="secondary">♡ Like</button><button class="secondary">☆ Favorite</button><button class="secondary">Share</button></div>`;
      if (variant==='C') return `<article class="detail">${art(w)}<div class="detail-copy"><div>${mainCopy}${actions}</div><aside class="detail-aside">${compatibility}${caveat}<h3 style="margin-top:24px">Use it</h3><ol class="muted"><li>Download the PNG.</li><li>Open Tesla app 4.59.0+.</li><li>Creations → Wrap → Upload.</li></ol></aside></div></article><div class="mobile-download"><button class="primary" data-download>Download Wrap</button></div>`;
      return `<section class="detail">${art(w)}<div class="detail-copy">${mainCopy}${compatibility}${caveat}${actions}<h3 style="margin-top:30px">After download</h3><ol class="muted" style="line-height:1.8"><li>Save the PNG somewhere your phone can select.</li><li>Open Tesla app 4.59.0 or later.</li><li>Choose Creations → Wrap → Upload.</li><li>In your vehicle, open Toybox → Paint Shop → Wraps.</li></ol><p class="muted" style="font-size:12px">USB instructions remain available as a fallback.</p></div></section><div class="mobile-download"><button class="primary" data-download>Download Wrap</button></div>`;
    }
    function downloadModal() {
      if (!state().downloadDialog) return '';
      const w=selectedWrap();
      return `<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="download-title"><div class="eyebrow">Prototype grant</div><h2 id="download-title" style="margin:8px 0">${w.title}.png is ready</h2><p class="muted">The real product will issue a private 60-second download link. This prototype does not contain or download a file.</p><div class="compat"><strong>${w.variant}</strong><br>Confirm this exact template before using the PNG.</div><ol><li>Download and save the PNG.</li><li>Open Tesla app 4.59.0 or later.</li><li>Go to Creations → Wrap → Upload.</li><li>Check Paint Shop in your vehicle if Upload is unavailable.</li></ol><div class="modal-actions"><button class="primary" data-close-download>Done</button><button class="secondary">View USB fallback</button></div></section></div>`;
    }
    function prototypeControls() {
      const s=state(); const keys=Object.keys(variants); const i=keys.indexOf(s.variant);
      return `<div class="prototype-bar" aria-label="Prototype variants"><button data-variant="${keys[(i+keys.length-1)%keys.length]}" aria-label="Previous variant">←</button><div class="prototype-label">${s.variant} — ${variants[s.variant]}</div><button data-variant="${keys[(i+1)%keys.length]}" aria-label="Next variant">→</button><button class="state-toggle" data-state-toggle>State</button></div><pre class="state-panel" id="state-panel">${JSON.stringify({...s, visibleWrapIds:visibleWraps().map(w=>w.id), selectedWrap:selectedWrap().id},null,2)}</pre>`;
    }
    function render() {
      const s=state();
      const content = s.screen==='detail' ? detail(s.variant) : s.screen==='explore' ? explore(s.variant) : s.variant==='A' ? homeA() : s.variant==='B' ? homeB() : homeC();
      document.getElementById('app').innerHTML = `<div class="shell variant-${s.variant.toLowerCase()}">${header()}<main>${content}</main>${downloadModal()}${prototypeControls()}</div>`;
      bind();
    }
    function bind() {
      document.querySelectorAll('[data-screen]').forEach(el=>el.addEventListener('click',()=>setParams({screen:el.dataset.screen, sort:el.dataset.sort||state().sort, download:null})));
      document.querySelectorAll('[data-open-wrap]').forEach(el=>{
        const open=()=>setParams({screen:'detail',wrap:el.dataset.openWrap,download:null}); el.addEventListener('click',open); el.addEventListener('keydown',e=>{if(e.key==='Enter')open()});
      });
      document.querySelectorAll('[data-model]').forEach(el=>el.addEventListener('click',()=>setParams({screen:'explore',model:el.dataset.model})));
      document.querySelectorAll('[data-variant]').forEach(el=>el.addEventListener('click',()=>setParams({variant:el.dataset.variant},true)));
      document.querySelectorAll('[data-download]').forEach(el=>el.addEventListener('click',()=>setParams({download:'ready'})));
      document.querySelectorAll('[data-close-download]').forEach(el=>el.addEventListener('click',()=>setParams({download:null},true)));
      document.querySelectorAll('[data-state-toggle]').forEach(el=>el.addEventListener('click',()=>document.getElementById('state-panel').classList.toggle('open')));
      const search=document.getElementById('search'); if(search) search.addEventListener('change',()=>setParams({q:search.value}));
      const model=document.getElementById('model'); if(model) model.addEventListener('change',()=>setParams({model:model.value}));
      const sort=document.getElementById('sort'); if(sort) sort.addEventListener('change',()=>setParams({sort:sort.value}));
    }
    addEventListener('popstate',render);
    addEventListener('keydown',e=>{
      if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable) return;
      if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
      const keys=Object.keys(variants), i=keys.indexOf(state().variant), delta=e.key==='ArrowRight'?1:-1;
      setParams({variant:keys[(i+delta+keys.length)%keys.length]},true);
    });
    render();
  </script>
</body>
</html>
